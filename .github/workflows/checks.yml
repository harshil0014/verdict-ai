name: Local-equivalent checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest
      - run: npm ci && npm run build
        working-directory: frontend
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the real application container
        run: docker build -t verdict-ci .
      - name: Verify container boundaries and health
        run: |
          docker run --rm --entrypoint sh verdict-ci -c 'test ! -f /app/backend/.env && test -f /app/frontend/dist/index.html'
          docker run -d --name verdict-ci -p 9000:8000 -e VERDICT_PUBLIC_HOST=127.0.0.1:9000 verdict-ci
          trap 'docker logs verdict-ci; docker rm -f verdict-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/api/health | python -c 'import json,sys; assert json.load(sys.stdin)["service"] == "VERDICT"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9000/api/cases)" = 401
